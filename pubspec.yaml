name: lawbot
description: AI Legal Assistant for Cybercrimes in the Philippines

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  cupertino_icons: ^1.0.2
  firebase_core: ^3.13.1
  firebase_auth: ^5.5.4
  supabase_flutter: ^2.9.0
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  url_launcher: ^6.2.4
  intl: ^0.20.2
  google_generative_ai: ^0.4.7
  uuid: ^4.1.0
  share_plus: ^11.0.0
  timeago: ^3.7.1
  connectivity_plus: ^6.0.5
  http: ^1.1.0
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  # Assets section for your logo and other images
  assets:
    - lib/assets/images/official_logo.png

# Flutter Launcher Icons configuration
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "lib/assets/images/official_logo.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "lib/assets/images/official_logo.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: "lib/assets/images/official_logo.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "lib/assets/images/official_logo.png"